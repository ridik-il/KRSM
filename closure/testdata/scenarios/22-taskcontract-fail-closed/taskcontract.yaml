# A well-formed-YAML but UN-COMPILABLE TaskContract — the negative artifact under
# test. An author reaches for `dim: reference`: a plausible-looking dimension name
# (DESIGN §6 once floated it alongside the real dimensions) that closure has never
# defined. The engine's scope dimensions are exactly four — resource, selector,
# namespace and ownership (closure.ScopeDim) — so `reference` can never compile.
# contract.Parse shapes this into a scope.TaskContract without judging it (shaping is
# its only job); scope.Compile → compileClause then rejects the unknown dimension
# with "unsupported scope dimension \"reference\"".
#
# HISTORY (slice 6, design rev 3 D1): this golden used to name `dim: ownership`, from
# when the contract surface lagged the engine and could not compile the ownership or
# namespace dimensions closure had already implemented. Slice 6 closed that gap, so
# `ownership` now compiles and is no longer a fail-closed proof; the golden was
# re-pointed to `reference`, which is genuinely not a dimension. The scenario's
# VERDICT CLASS is unchanged — a load-time fail-closed error, no computable closure —
# only the dimension named and the error text moved.
#
# This is the on-message fail-closed proof (ADR-0009): rather than silently narrowing
# to an allow-nothing or partial scope, KRSM tells the author loudly that the
# dimension is unsupported. Load() therefore returns an error and never yields a
# Scenario. There is deliberately NO scope.yaml, so the taskcontract path is the one
# exercised (loadScope prefers taskcontract.yaml; a missing one would fall back to
# scope.yaml). See expected.yaml for the loadError convention that asserts this.
apiVersion: krsm.io/v1alpha1
kind: TaskContract
metadata:
  name: restart-frontend-by-reference
  namespace: prod
spec:
  allow:
    - dim: reference
      gvk: {group: apps, version: v1, kind: Deployment}
      namespace: prod
      name: frontend
  maxSeverity: high
